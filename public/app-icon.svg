<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Aura -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Gradient for Cap -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Book Page Gradient -->
    <linearGradient id="bookLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="bookRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Coffee Gradient -->
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Rounded App Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle Border Glow -->
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#6366F1" stroke-width="3" stroke-opacity="0.4" />

  <!-- Center Ambient Light -->
  <circle cx="256" cy="245" r="210" fill="url(#centerGlow)" />

  <!-- Background Sparkling Stars (Hedef Derece) -->
  <path d="M410 95 L416 115 L436 121 L416 127 L410 147 L404 127 L384 121 L404 115 Z" fill="#FDE68A" opacity="0.85" filter="url(#goldGlow)" />
  <path d="M92 140 L96 154 L110 158 L96 162 L92 176 L88 162 L74 158 L88 154 Z" fill="#38BDF8" opacity="0.7" />
  <circle cx="430" cy="210" r="4" fill="#FBBF24" opacity="0.6" />
  <circle cx="85" cy="270" r="3" fill="#A5B4FC" opacity="0.5" />

  <!-- Study Desk Line -->
  <line x1="64" y1="420" x2="448" y2="420" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <line x1="120" y1="438" x2="392" y2="438" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" opacity="0.3" />

  <!-- MAIN EMBLEM GROUP (Graduation Cap + Open YKS Book + Coffee) -->
  <g filter="url(#shadow)">
    <!-- OPEN BOOK (YKS Soru Bankası / Fasikül) -->
    <!-- Book Shadow Layer -->
    <path d="M106 310 C155 292 225 298 256 322 C287 298 357 292 406 310 L406 385 C357 362 287 368 256 395 C225 368 155 362 106 385 Z" fill="#030712" opacity="0.6" />

    <!-- Left Page -->
    <path d="M112 300 C160 284 228 290 256 315 L256 385 C228 358 160 352 112 374 Z" fill="url(#bookLeftGrad)" />
    <!-- Left Page Inner Lines (Text preview) -->
    <line x1="135" y1="318" x2="235" y2="306" stroke="#0369A1" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="135" y1="334" x2="235" y2="322" stroke="#0369A1" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="135" y1="350" x2="205" y2="338" stroke="#0369A1" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Right Page -->
    <path d="M400 300 C352 284 284 290 256 315 L256 385 C284 358 352 352 400 374 Z" fill="url(#bookRightGrad)" />
    <!-- Right Page Inner Lines (Math formula preview) -->
    <line x1="277" y1="306" x2="377" y2="318" stroke="#0C4A6E" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="277" y1="322" x2="377" y2="334" stroke="#0C4A6E" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="277" y1="338" x2="347" y2="350" stroke="#0C4A6E" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Book Spine Highlight -->
    <line x1="256" y1="315" x2="256" y2="385" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

    <!-- GRADUATION CAP (Mezun / Üniversite Zaferi) -->
    <!-- Cap Skull Base -->
    <path d="M180 205 L180 248 C180 278 332 278 332 248 L332 205 L256 235 Z" fill="#92400E" />
    <path d="M192 215 C210 248 302 248 320 215 C295 240 217 240 192 215 Z" fill="#78350F" opacity="0.7" />

    <!-- Cap Mortarboard Diamond (Gold Foil Gradient) -->
    <polygon points="256,120 398,178 256,236 114,178" fill="url(#goldGrad)" />
    <!-- Inner Diamond Edge Shading -->
    <polygon points="256,128 382,178 256,228 130,178" fill="#FDE68A" opacity="0.3" />

    <!-- Cap Button Top -->
    <ellipse cx="256" cy="178" rx="10" ry="7" fill="#78350F" />
    <ellipse cx="256" cy="176" rx="8" ry="5" fill="#FBBF24" />

    <!-- Tassel Ribbon Swirl -->
    <path d="M256 178 C215 190 156 208 148 250" fill="none" stroke="#FDE68A" stroke-width="5" stroke-linecap="round" />
    <!-- Tassel Fringe -->
    <polygon points="142,248 154,248 152,275 144,275" fill="#F59E0B" />
    <polygon points="144,272 152,272 150,282 146,282" fill="#D97706" />

    <!-- STEAMING COFFEE MUG (Kütüphane & Gece Çalışması) -->
    <g transform="translate(346, 335)">
      <!-- Mug Body -->
      <rect x="0" y="8" width="34" height="38" rx="8" fill="url(#coffeeGrad)" />
      <!-- Mug Handle -->
      <path d="M34 16 C44 16 44 32 34 32" fill="none" stroke="#FB923C" stroke-width="4.5" stroke-linecap="round" />
      <!-- Mug Rim -->
      <ellipse cx="17" cy="8" rx="17" ry="5" fill="#FDBA74" />
      <ellipse cx="17" cy="8" rx="13" ry="3.5" fill="#431407" />
      <!-- Steam Lines -->
      <path d="M10 -2 C8 -10 14 -14 11 -22" fill="none" stroke="#FED7AA" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
      <path d="M20 -4 C18 -12 24 -16 21 -25" fill="none" stroke="#FED7AA" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- HIGHLIGHTER PEN (Yeşil Fosforlu Kalem) -->
    <g transform="translate(100, 360) rotate(-35)">
      <rect x="0" y="0" width="12" height="42" rx="3" fill="#10B981" />
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#047857" />
      <!-- Chisel Tip -->
      <polygon points="2,42 10,42 8,52 4,52" fill="#34D399" />
    </g>
  </g>

  <!-- Bottom Brand Text (YKS TYCOON) -->
  <text x="256" y="475" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" letter-spacing="4">
    MEZUN TYCOON
  </text>
  <text x="256" y="495" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#38BDF8" letter-spacing="3">
    YKS 2026 SIMULATOR
  </text>
</svg>
